
version: "3.8"

services:

  postgres:
    image: postgres:16
    container_name: postgres_portfolio
    restart: unless-stopped

    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n123
      POSTGRES_DB: crm_whatsapp

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n
    container_name: n8n_portfolio
    restart: unless-stopped

    ports:
      - "5678:5678"

    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: crm_whatsapp
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: n8n123

      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http

      WEBHOOK_URL: http://localhost:5678

      N8N_SECURE_COOKIE: false

      EXECUTIONS_DATA_PRUNE: true
      EXECUTIONS_DATA_MAX_AGE: 24
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 1000

    depends_on:
      - postgres

    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data:




